<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Mudae Tier Maker - by Tuxn88</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --bg: #0d0d0d; --panel: #161616; --text: #f0f0f0; 
            --accent: #2ecc71; --btn-bg: #333; --btn-text: #fff;
            --bg-img: none; --bg-dim: 0;
            --pastel-blue: #74b9ff; --pastel-purple: #a29bfe; 
            --pastel-green: #55efc4; --pastel-pink: #fd79a8;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg); 
            background-image: linear-gradient(rgba(0,0,0, var(--bg-dim)), rgba(0,0,0, var(--bg-dim))), var(--bg-img);
            background-size: cover; background-attachment: fixed; background-position: center;
            color: var(--text); padding: 15px; margin: 0; transition: background 0.3s;
        }

        /* --- SIDEBAR --- */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 998; }
        #sidebar { position: fixed; left: -300px; top: 0; width: 280px; height: 100%; background: var(--panel); box-shadow: 5px 0 15px rgba(0,0,0,0.5); transition: 0.3s; z-index: 999; padding: 20px; border-right: 1px solid rgba(255,255,255,0.1); overflow-y: auto; box-sizing: border-box; }
        #sidebar.open { left: 0; }
        .sidebar-toggle { position: fixed; left: 15px; top: 15px; width: 45px; height: 45px; background: var(--panel); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 900; font-size: 24px; color: var(--text); }
        
        /* --- POTATO MODE CSS --- */
        body.ultralow * { transition: none !important; animation: none !important; backdrop-filter: none !important; box-shadow: none !important; }
        body.ultralow .card img[src*=".gif"] { display: none !important; }
        body.ultralow .card[data-is-gif="true"]::before { content: "🥔"; display: flex; align-items: center; justify-content: center; height: 115px; font-size: 40px; background: #333; }
        body.ultralow img { image-rendering: pixelated; filter: contrast(120%) grayscale(100%); }

        .menu { background: var(--panel); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); margin-top: 50px; }
        textarea { width: 100%; height: 60px; background: rgba(0,0,0,0.2); color: var(--text); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 12px; margin: 10px 0; box-sizing: border-box; resize: none; }
        #output { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 6px; border: 1px solid var(--accent); color: var(--accent); font-family: monospace; font-size: 11px; min-height: 20px; word-break: break-all; }
        
        .btns-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        button { border: none; padding: 10px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 10px; display: flex; align-items: center; gap: 4px; background: var(--btn-bg); color: var(--btn-text); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-reset { margin-left: auto; background: #c0392b !important; color: white !important; }
        
        #lista-tiers { display: flex; flex-direction: column; gap: 8px; }
        .tier-row { display: flex; min-height: 110px; background: rgba(0,0,0,0.3); border-radius: 8px; overflow: hidden; border: 1px solid transparent; }
        .tier-sidebar { display: flex; align-items: stretch; background: rgba(0,0,0,0.2); }
        .tier-handle { cursor: grab; width: 30px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #666; }
        .color-strip { width: 8px; cursor: pointer; border: none; padding: 0; }
        .tier-label { width: 110px; display: flex; align-items: center; justify-content: center; padding: 10px; position: relative; color: #000; font-weight: 900; text-transform: uppercase; text-align: center; font-size: 12px; }
        .btn-del { position: absolute; top: 4px; right: 4px; cursor: pointer; font-size: 9px; background: rgba(0,0,0,0.2); border-radius: 3px; color: white; border:none; }
        
        .tier-content { flex-grow: 1; display: flex; flex-wrap: wrap; gap: 5px; padding: 10px; min-height: 100px; }
        .card { width: 85px; background: #1f1f1f; border-radius: 4px; text-align: center; cursor: grab; border: 1px solid #333; position: relative; }
        .card img { width: 100%; height: 115px; object-fit: cover; border-radius: 3px 3px 0 0; pointer-events: none; }
        .card p { font-size: 8px; padding: 4px 2px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ccc; }
        .card.missing::after { content: "❌"; position: absolute; top: 2px; right: 2px; font-size: 14px; text-shadow: 0 0 3px black; }

        .sidebar-header { font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; font-size: 12px; }
        .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 15px; }
        .theme-btn { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid rgba(255,255,255,0.1); padding: 8px; font-size: 10px; }
        
        .footer-area { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        #trash-zone { width: 130px; height: 50px; border: 2px dashed #ff7675; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #ff7675; font-size: 11px; font-weight: bold; }
        .credits { opacity: 0.2; font-size: 10px; }
        .no-export { display: none !important; }
    </style>
</head>
<body>

<div id="overlay" onclick="toggleSidebar()"></div>
<div class="sidebar-toggle" onclick="toggleSidebar()">&#9776;</div>

<div id="sidebar">
    <div class="sidebar-header">THEMES</div>
    <div class="theme-grid">
        <button class="theme-btn" onclick="applyTheme('dark')">Tuxn88</button>
        <button class="theme-btn" onclick="applyTheme('miku')">Miku</button>
        <button class="theme-btn" onclick="applyTheme('hacker')">Hacker</button>
        <button class="theme-btn" onclick="applyTheme('cyber')">Cyber</button>
    </div>
    
    <div class="sidebar-header">PERFORMANCE</div>
    <button class="theme-btn" id="freezeBtn" style="width:100%; margin-bottom:5px;" onclick="toggleFreeze()">❄️ PERFORMANCE: OFF</button>
    <button class="theme-btn" id="ultraBtn" style="width:100%; background:#e74c3c; color:white;" onclick="toggleUltraLow()">☢️ POTATO MODE: OFF</button>

    <div class="sidebar-header" style="margin-top:20px">CUSTOM COLORS</div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
        <input type="color" id="cfg-bg" oninput="updateUI()">
        <input type="color" id="cfg-panel" oninput="updateUI()">
    </div>
</div>

<div class="menu">
    <textarea id="inputLista" placeholder="Name - URL"></textarea>
    <div class="btns-row">
        <button onclick="gerarCards()">📥 LOAD</button>
        <button onclick="adicionarTier()">➕ TIER</button>
        <button onclick="randomPastelPalette()">🎨 COLORS</button>
        <button onclick="salvarLocal()">💾 SAVE</button>
        <button onclick="baixarImagem()">🖼️ PNG</button>
        <button class="btn-reset" onclick="resetarTudo()">🔄 RESET</button>
    </div>
</div>

<div id="capture-area" style="padding: 10px;">
    <div id="lista-tiers"></div>
    <div id="reserva-container">
        <h4 style="opacity:0.5; font-size:12px">Storage</h4>
        <div id="reserva" class="tier-content"></div>
    </div>
    <div class="footer-area">
        <div id="ui-actions" style="display:flex; gap:10px;">
            <div id="trash-zone">TRASH</div>
            <button style="background:#ff7675; color:white; border-radius:8px; border:none; padding:0 10px;" onclick="removeMarked()">❌ CLEAR X</button>
        </div>
        <div class="credits">by tuxn88</div>
    </div>
</div>

<div class="menu">
    <button style="background:#3498db; color:white; width:100%; margin-bottom:5px;" onclick="gerarTextoMM()">🔄 REFRESH</button>
    <button style="background:#2ecc71; color:white; width:100%;" onclick="copiarNomes()">📋 COPY $MM</button>
    <div id="output" style="margin-top:10px">...</div>
</div>

<script>
    let sortables = [];
    const listaTiers = document.getElementById('lista-tiers');
    const reserva = document.getElementById('reserva');

    function toggleSidebar() {
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('overlay');
        sb.classList.toggle('open');
        ov.style.display = sb.classList.contains('open') ? 'block' : 'none';
    }

    function updateUI() {
        const root = document.documentElement;
        root.style.setProperty('--bg', document.getElementById('cfg-bg').value);
        root.style.setProperty('--panel', document.getElementById('cfg-panel').value);
    }

    function toggleFreeze() {
        const active = document.body.classList.toggle('freeze-mode');
        document.getElementById('freezeBtn').textContent = active ? '🔥 PERFORMANCE: ON' : '❄️ PERFORMANCE: OFF';
        updateSortables();
    }

    function toggleUltraLow() {
        const active = document.body.classList.toggle('ultralow');
        const ultraBtn = document.getElementById('ultraBtn');
        const freezeBtn = document.getElementById('freezeBtn');
        
        if (active) {
            if (!document.body.classList.contains('freeze-mode')) toggleFreeze();
            freezeBtn.disabled = true;
            ultraBtn.textContent = "☢️ POTATO MODE: ON";
        } else {
            freezeBtn.disabled = false;
            ultraBtn.textContent = "☢️ POTATO MODE: OFF";
        }
        updateSortables();
    }

    function updateSortables() {
        const isPotato = document.body.classList.contains('ultralow');
        const anim = isPotato ? 0 : 150;
        sortables.forEach(s => {
            s.options.animation = anim;
        });
    }

    function fixUrl(url) {
        if (url && url.includes('mudae.net')) return 'https://images.weserv.nl/?url=' + encodeURIComponent(url.replace('https://', '')) + '&n=-1';
        return url;
    }

    function configurarDrag(el) {
        const s = new Sortable(el, { 
            group: 'chars', 
            animation: document.body.classList.contains('ultralow') ? 0 : 150, 
            multiDrag: true, 
            selectedClass: 'selected' 
        });
        sortables.push(s);
    }

    function renderCard(p, container) {
        const isGif = p.url.toLowerCase().includes('.gif');
        const card = document.createElement('div');
        card.className = p.missing ? 'card missing' : 'card';
        card.setAttribute('data-nome', p.nome);
        card.setAttribute('data-is-gif', isGif);
        card.innerHTML = `<img src="${fixUrl(p.url)}" loading="lazy"><p>${p.nome}</p>`;
        container.appendChild(card);
    }

    function adicionarTier(nome = "NEW TIER", cor = "#74b9ff") {
        const row = document.createElement('div');
        row.className = 'tier-row';
        row.style.borderColor = cor;
        row.innerHTML = `
            <div class="tier-sidebar"><div class="tier-handle">☰</div><input type="color" class="color-strip" value="${cor}" oninput="updateTierColor(this)"></div>
            <div class="tier-label" style="background:${cor}"><button class="btn-del" onclick="this.closest('.tier-row').remove()">X</button><span contenteditable="true">${nome}</span></div>
            <div class="tier-content"></div>
        `;
        listaTiers.appendChild(row);
        configurarDrag(row.querySelector('.tier-content'));
    }

    function updateTierColor(input) {
        const row = input.closest('.tier-row');
        row.style.borderColor = input.value;
        row.querySelector('.tier-label').style.background = input.value;
    }

    function gerarCards() {
        const linhas = document.getElementById('inputLista').value.split('\n');
        linhas.forEach(linha => {
            if (linha.includes(' - ')) {
                const [nome, url] = linha.split(' - ').map(s => s.trim());
                renderCard({nome, url, missing: false}, reserva);
            }
        });
        document.getElementById('inputLista').value = "";
    }

    function aplicarEstiloIncial() {
        document.getElementById('cfg-bg').value = "#0d0d0d";
        document.getElementById('cfg-panel').value = "#161616";
        updateUI();
    }

    function applyTheme(m) {
        const t = { dark: ["#0d0d0d", "#161616"], miku: ["#1d2a2e", "#e6f7f6"], hacker: ["#000", "#0a0a0a"], cyber: ["#0b0014", "#1a002e"] };
        document.getElementById('cfg-bg').value = t[m][0];
        document.getElementById('cfg-panel').value = t[m][1];
        updateUI();
    }

    new Sortable(listaTiers, { handle: '.tier-handle', animation: 150 });
    new Sortable(document.getElementById('trash-zone'), { group: 'chars', onAdd: (e) => { (e.items.length > 0 ? e.items : [e.item]).forEach(i => i.remove()); } });
    configurarDrag(reserva);
    window.onload = () => { adicionarTier("tuxn88", "#2dc7b2"); aplicarEstiloIncial(); };
</script>
</body>
</html>
