<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Mudae Tier Maker - by Tuxn88</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { 
            --bg: #0d0d0d; --panel: #161616; --text: #f0f0f0; 
            --accent: #2ecc71; /* Cor de destaque (ex: texto do hacker) */
            --pastel-blue: #74b9ff; --pastel-purple: #a29bfe; 
            --pastel-green: #55efc4; --pastel-orange: #fab1a0; 
            --pastel-red: #ff7675; --pastel-pink: #fd79a8;
            --bg-img: none;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg); 
            background-image: var(--bg-img);
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
            color: var(--text); 
            padding: 15px; 
            margin: 0; 
            transition: background 0.3s, color 0.3s;
        }

        /* --- SIDEBAR --- */
        #sidebar {
            position: fixed;
            left: -280px;
            top: 0;
            width: 260px;
            height: 100%;
            background: var(--panel);
            box-shadow: 5px 0 15px rgba(0,0,0,0.5);
            transition: 0.3s;
            z-index: 999;
            padding: 20px;
            border-right: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
            box-sizing: border-box;
        }
        #sidebar.open { left: 0; }
        .sidebar-toggle {
            position: fixed;
            left: 15px;
            bottom: 15px;
            width: 40px;
            height: 40px;
            background: var(--pastel-purple);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .sidebar-header { font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 5px; font-size: 14px; }
        
        .menu { background: var(--panel); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1); }
        
        /* Input e Output agora seguem o tema */
        textarea, #output { 
            width: 100%; 
            background: rgba(0,0,0,0.2); 
            color: var(--text); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 6px; 
            padding: 12px; 
            box-sizing: border-box; 
        }
        textarea { height: 60px; margin: 10px 0; resize: none; }
        #output { 
            min-height: 20px; 
            word-break: break-all; 
            font-family: monospace; 
            font-size: 11px; 
            color: var(--accent); /* Segue a cor de destaque do tema */
            border: 1px solid var(--accent);
            opacity: 0.9;
        }
        
        #lista-tiers { display: flex; flex-direction: column; gap: 8px; }
        .tier-row { display: flex; min-height: 110px; background: rgba(0,0,0,0.4); border-radius: 8px; overflow: hidden; border: 1px solid transparent; backdrop-filter: blur(2px); }
        .tier-sidebar { display: flex; align-items: stretch; background: rgba(0,0,0,0.2); border-right: 1px solid rgba(255,255,255,0.05); }
        .tier-handle { cursor: grab; width: 30px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #666; }
        .color-strip { width: 8px; cursor: pointer; border: none; padding: 0; background: none; }
        .tier-label { width: 110px; display: flex; align-items: center; justify-content: center; padding: 10px; position: relative; color: #000; font-weight: 900; text-transform: uppercase; text-align: center; font-size: 12px; }
        .btn-del { position: absolute; top: 4px; right: 4px; cursor: pointer; font-size: 9px; background: rgba(0,0,0,0.2); border-radius: 3px; padding: 2px 4px; border: none; color: white; }
        
        .tier-content { flex-grow: 1; display: flex; flex-wrap: wrap; gap: 5px; padding: 10px; min-height: 100px; }
        
        .card { width: 85px; background: #1f1f1f; border-radius: 4px; text-align: center; cursor: grab; border: 1px solid #333; position: relative; transition: transform 0.1s; }
        .card img { width: 100%; height: 115px; object-fit: cover; border-radius: 3px 3px 0 0; display: block; pointer-events: none; }
        .card p { font-size: 8px; padding: 4px 2px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #ccc; }
        .card.selected { border: 2px solid var(--pastel-blue); z-index: 10; box-shadow: 0 0 10px rgba(116, 185, 255, 0.5); }
        .card.missing::after { content: "❌"; position: absolute; top: 2px; right: 2px; font-size: 14px; text-shadow: 0 0 3px black; z-index: 5; }

        .ghost { opacity: 0.1; }
        body.freeze-mode img { image-rendering: -webkit-optimize-contrast; filter: saturate(0.8); }
        
        .btns-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        button { border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; font-size: 10px; display: flex; align-items: center; gap: 4px; color: #2d3436; }
        .btn-add { background: var(--pastel-blue); }
        .btn-tier { background: var(--pastel-purple); }
        .btn-colors { background: var(--pastel-pink); }
        .btn-freeze { background: #dfe6e9; width: 100%; margin-top: 10px; }
        .btn-save { background: #d35400; color: white; }
        .btn-img { background: var(--pastel-green); }
        .btn-reset { background: var(--pastel-red); margin-left: auto; }
        
        /* Itens dentro da Sidebar */
        .custom-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 8px; }
        .custom-group label { font-size: 11px; opacity: 0.8; text-transform: uppercase; }
        .theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .theme-btn { padding: 6px; font-size: 10px; background: rgba(255,255,255,0.1); color: var(--text); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; cursor: pointer; }
        .theme-btn:hover { background: rgba(255,255,255,0.2); }

        .export-section { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .export-btns { display: flex; gap: 8px; }
        .btn-export { background: #2ecc71; color: white; flex: 3; justify-content: center; font-size: 11px; }
        .btn-refresh { background: #3498db; color: white; flex: 1; justify-content: center; font-size: 11px; }
        
        .footer-area { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding: 10px; }
        .action-zone { display: flex; gap: 10px; }
        #trash-zone { width: 130px; height: 50px; border: 2px dashed #ff7675; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #ff7675; font-weight: bold; font-size: 11px; }
        .btn-clear-x { background: #ff7675; color: white; padding: 0 15px; border-radius: 8px; cursor: pointer; border: none; font-weight: bold; font-size: 10px; }
        .credits { opacity: 0.1; font-size: 10px; color: var(--text); }
        .no-export { display: none !important; }
    </style>
</head>
<body>

<div class="sidebar-toggle" onclick="toggleSidebar()">⚙️</div>

<div id="sidebar">
    <div class="sidebar-header">🎨 THEMES & CUSTOM</div>
    
    <div class="custom-group">
        <label>Presets</label>
        <div class="theme-grid">
            <button class="theme-btn" onclick="applyTheme('dark')">Default</button>
            <button class="theme-btn" onclick="applyTheme('light')">Light</button>
            <button class="theme-btn" onclick="applyTheme('hacker')">Hacker</button>
            <button class="theme-btn" onclick="applyTheme('basalt')">Basalt</button>
            <button class="theme-btn" onclick="applyTheme('miku')">Miku</button>
        </div>
    </div>

    <div class="custom-group">
        <label>Colors</label>
        <div style="display:flex; gap:10px; align-items:center;">
            <input type="color" id="cfg-bg" oninput="updateUI()"> <span>Background</span>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <input type="color" id="cfg-panel" oninput="updateUI()"> <span>Menus</span>
        </div>
        <div style="display:flex; gap:10px; align-items:center;">
            <input type="color" id="cfg-text" oninput="updateUI()"> <span>Text</span>
        </div>
    </div>

    <div class="custom-group">
        <label>Background Image</label>
        <input type="text" id="cfg-bg-img" placeholder="URL da Imagem" style="font-size: 10px; padding: 5px;" oninput="updateUI()">
    </div>

    <div class="sidebar-header" style="margin-top:20px;">⚡ SYSTEM</div>
    <button class="btn-freeze" id="freezeBtn" onclick="toggleFreeze()">❄️ PERFORMANCE</button>
    
    <p style="font-size: 9px; opacity: 0.5; margin-top: 30px;">Ajuste o visual e feche o menu na engrenagem.</p>
</div>

<div class="menu">
    <textarea id="inputLista" placeholder="Name - Image URL"></textarea>
    <div class="btns-row">
        <button class="btn-add" onclick="gerarCards()">📥 LOAD</button>
        <button class="btn-tier" onclick="adicionarTier()">➕ TIER</button>
        <button class="btn-colors" onclick="randomPastelPalette()">🎨 COLORS</button>
        <button class="btn-save" onclick="salvarLocal()">💾 SAVE</button>
        <button class="btn-img" onclick="baixarImagem()">🖼️ PNG</button>
        <button class="btn-reset" onclick="resetarTudo()">🔄 RESET</button>
    </div>
</div>

<div id="capture-area" style="padding: 10px;">
    <div id="lista-tiers"></div>
    <div id="reserva-container">
        <h4>Storage</h4>
        <div id="reserva" class="tier-content"></div>
    </div>

    <div class="footer-area">
        <div class="action-zone" id="ui-actions">
            <div id="trash-zone">🗑️ DROP TO DELETE</div>
            <button class="btn-clear-x" onclick="removeMarked()">❌ CLEAR ALL 'X'</button>
        </div>
        <div class="credits">@tuxn88</div>
    </div>
</div>

<div class="menu export-section">
    <div class="export-btns">
        <button class="btn-refresh" onclick="gerarTextoMM()">🔄 ATUALIZAR</button>
        <button class="btn-export" onclick="copiarNomes()">📋 COPIAR NOMES</button>
    </div>
    <div id="output">...</div>
</div>

<script>
    const listaTiers = document.getElementById('lista-tiers');
    const reserva = document.getElementById('reserva');
    const trashZone = document.getElementById('trash-zone');

    // Toggle Sidebar
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
    }

    // Funções de Estilo e Temas
    function updateUI() {
        const root = document.documentElement;
        root.style.setProperty('--bg', document.getElementById('cfg-bg').value);
        root.style.setProperty('--panel', document.getElementById('cfg-panel').value);
        root.style.setProperty('--text', document.getElementById('cfg-text').value);
        
        const imgUrl = document.getElementById('cfg-bg-img').value;
        root.style.setProperty('--bg-img', imgUrl ? `url('${imgUrl}')` : 'none');
    }

    function applyTheme(mode) {
        const cfg = {
            dark:    { bg: '#0d0d0d', panel: '#161616', text: '#f0f0f0', accent: '#2ecc71', img: '' },
            light:   { bg: '#f0f0f0', panel: '#ffffff', text: '#2d3436', accent: '#3498db', img: '' },
            hacker:  { bg: '#000000', panel: '#050505', text: '#00ff41', accent: '#00ff41', img: '' },
            basalt:  { bg: '#2c3e50', panel: '#34495e', text: '#ecf0f1', accent: '#e67e22', img: '' },
            miku:    { bg: '#39c5bb', panel: '#ffffff', text: '#000000', accent: '#39c5bb', img: '' }
        };
        const theme = cfg[mode];
        document.getElementById('cfg-bg').value = theme.bg;
        document.getElementById('cfg-panel').value = theme.panel;
        document.getElementById('cfg-text').value = theme.text;
        document.getElementById('cfg-bg-img').value = theme.img;
        document.documentElement.style.setProperty('--accent', theme.accent);
        updateUI();
    }

    // --- CÓDIGO ORIGINAL MANTIDO ABAIXO ---

    function fixUrl(url) {
        if (url && url.includes('mudae.net')) {
            return 'https://images.weserv.nl/?url=' + encodeURIComponent(url.replace('https://', '')) + '&n=-1';
        }
        return url;
    }

    new Sortable(listaTiers, { handle: '.tier-handle', animation: 150, ghostClass: 'ghost' });

    function configurarDrag(el) {
        new Sortable(el, { 
            group: 'chars', 
            animation: 150, 
            multiDrag: true, 
            selectedClass: 'selected',
            ghostClass: 'ghost',
            onStart: function() {
                this.options.animation = document.body.classList.contains('freeze-mode') ? 0 : 150;
            }
        });
    }

    new Sortable(trashZone, {
        group: 'chars',
        onAdd: function (evt) {
            const items = evt.items.length > 0 ? evt.items : [evt.item];
            items.forEach(el => el.remove());
        }
    });

    configurarDrag(reserva);

    function toggleFreeze() {
        document.body.classList.toggle('freeze-mode');
        const btn = document.getElementById('freezeBtn');
        btn.textContent = document.body.classList.contains('freeze-mode') ? '🔥 NORMAL MODE' : '❄️ PERFORMANCE';
    }

    function adicionarTier(nome = "NEW TIER", cor = "#ff7f7f") {
        const row = document.createElement('div');
        row.className = 'tier-row';
        row.style.borderColor = cor;
        row.innerHTML = `
            <div class="tier-sidebar"><div class="tier-handle">☰</div><input type="color" class="color-strip" value="${cor}" oninput="updateTierColor(this)"></div>
            <div class="tier-label" style="background:${cor}"><button class="btn-del" onclick="this.closest('.tier-row').remove()">X</button><span contenteditable="true">${nome}</span></div>
            <div class="tier-content"></div>
        `;
        listaTiers.appendChild(row);
        configurarDrag(row.querySelector('.tier-content'));
    }

    function updateTierColor(input) {
        const row = input.closest('.tier-row');
        row.style.borderColor = input.value;
        row.querySelector('.tier-label').style.background = input.value;
    }

    function randomPastelPalette() {
        const rows = document.querySelectorAll('.tier-row');
        const baseHue = Math.floor(Math.random() * 360);
        rows.forEach((row, index) => {
            const hexColor = hslToHex((baseHue + (index * 20)) % 360, 70, 75);
            const input = row.querySelector('.color-strip');
            input.value = hexColor;
            updateTierColor(input);
        });
    }

    function hslToHex(h, s, l) {
        l /= 100;
        const a = s * Math.min(l, 1 - l) / 100;
        const f = n => {
            const k = (n + h / 30) % 12;
            const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `#${f(0)}${f(8)}${f(4)}`;
    }

    function gerarCards() {
        const linhas = document.getElementById('inputLista').value.split('\n');
        const novosNomes = [];
        linhas.forEach(linha => {
            if (linha.includes(' - ')) {
                const [nome, url] = linha.split(' - ').map(s => s.trim());
                novosNomes.push(nome);
                const existente = document.querySelector(`[data-nome="${nome}"]`);
                if (existente) {
                    existente.querySelector('img').src = fixUrl(url);
                    existente.classList.remove('missing');
                } else {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.setAttribute('data-nome', nome);
                    card.innerHTML = `<img src="${fixUrl(url)}" loading="lazy"><p>${nome}</p>`;
                    reserva.appendChild(card);
                }
            }
        });
        if(novosNomes.length > 0) {
            document.querySelectorAll('.card').forEach(card => {
                if (!novosNomes.includes(card.getAttribute('data-nome'))) card.classList.add('missing');
            });
        }
        document.getElementById('inputLista').value = "";
    }

    function gerarTextoMM() {
        const rows = document.querySelectorAll('.tier-row');
        let nomesMM = [];
        rows.forEach(row => {
            const cards = row.querySelectorAll('.card');
            cards.forEach(c => {
                let nomeBruto = c.getAttribute('data-nome');
                nomesMM.push(nomeBruto.split('|')[0].trim());
            });
        });
        
        if (nomesMM.length === 0) {
            document.getElementById('output').innerText = "Tiers vazios!";
            return "";
        }
        const result = nomesMM.join(' $ ');
        document.getElementById('output').innerText = result;
        return result;
    }

    function copiarNomes() {
        const texto = gerarTextoMM();
        if (texto) {
            navigator.clipboard.writeText(texto).then(() => {
                alert("Copiado com sucesso!");
            });
        }
    }

    function removeMarked() {
        if(confirm("Remover personagens marcadas com ❌?")) {
            document.querySelectorAll('.card.missing').forEach(c => c.remove());
        }
    }

    function resetarTudo() {
        if(confirm("Resetar tudo?")) {
            localStorage.removeItem('mudaeFinal_v5');
            location.reload();
        }
    }

    async function baixarImagem() {
        const ui = document.getElementById('ui-actions');
        ui.classList.add('no-export');
        const area = document.getElementById('capture-area');
        const canvas = await html2canvas(area, { backgroundColor: null, useCORS: true, scale: 2 });
        const link = document.createElement('a');
        link.download = 'mudae-tier.png';
        link.href = canvas.toDataURL();
        link.click();
        ui.classList.remove('no-export');
    }

    function salvarLocal() {
        const dados = {
            config: {
                bg: document.getElementById('cfg-bg').value,
                panel: document.getElementById('cfg-panel').value,
                text: document.getElementById('cfg-text').value,
                bgImg: document.getElementById('cfg-bg-img').value,
                accent: document.documentElement.style.getPropertyValue('--accent')
            },
            tiers: Array.from(document.querySelectorAll('.tier-row')).map(row => ({
                nome: row.querySelector('.tier-label span').innerText,
                cor: row.querySelector('.color-strip').value,
                personagens: Array.from(row.querySelectorAll('.card')).map(c => ({
                    nome: c.getAttribute('data-nome'),
                    url: c.querySelector('img').src,
                    missing: c.classList.contains('missing')
                }))
            })),
            reserva: Array.from(reserva.querySelectorAll('.card')).map(c => ({
                nome: c.getAttribute('data-nome'),
                url: c.querySelector('img').src,
                missing: c.classList.contains('missing')
            }))
        };
        localStorage.setItem('mudaeFinal_v5', JSON.stringify(dados));
        alert("Saved!");
    }

    function carregarLocal() {
        const salvo = localStorage.getItem('mudaeFinal_v5');
        if (!salvo) { 
            adicionarTier("tuxn88", "#2dc7b2"); 
            applyTheme('dark');
            return; 
        }
        const dados = JSON.parse(salvo);
        
        // Carregar Cores/Tema
        if(dados.config) {
            document.getElementById('cfg-bg').value = dados.config.bg;
            document.getElementById('cfg-panel').value = dados.config.panel;
            document.getElementById('cfg-text').value = dados.config.text;
            document.getElementById('cfg-bg-img').value = dados.config.bgImg || "";
            document.documentElement.style.setProperty('--accent', dados.config.accent || '#2ecc71');
            updateUI();
        }

        dados.tiers.forEach(t => {
            adicionarTier(t.nome, t.cor);
            const container = listaTiers.lastElementChild.querySelector('.tier-content');
            t.personagens.forEach(p => renderCard(p, container));
        });
        dados.reserva.forEach(p => renderCard(p, reserva));
    }

    function renderCard(p, container) {
        const card = document.createElement('div');
        card.className = p.missing ? 'card missing' : 'card';
        card.setAttribute('data-nome', p.nome);
        card.innerHTML = `<img src="${fixUrl(p.url)}" loading="lazy"><p>${p.nome}</p>`;
        container.appendChild(card);
    }
    window.onload = carregarLocal;
</script>
</body>
</html>
