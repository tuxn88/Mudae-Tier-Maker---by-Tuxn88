<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mudae Tier Maker - by Tuxn88</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --bg: #0d0d0d; --panel: #161616; --text: #f0f0f0; --pastel-blue: #74b9ff; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .menu { background: var(--panel); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        textarea { width: 100%; height: 80px; background: #1f1f1f; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
        
        #lista-tiers { display: flex; flex-direction: column; gap: 10px; }
        .tier-row { display: flex; min-height: 120px; background: #111; border-radius: 8px; border: 1px solid #333; margin-bottom: 5px; }
        .tier-label { width: 100px; display: flex; align-items: center; justify-content: center; background: #2dc7b2; color: #000; font-weight: bold; text-align: center; padding: 5px; cursor: pointer; position: relative; }
        .tier-content { flex-grow: 1; display: flex; flex-wrap: wrap; gap: 5px; padding: 10px; min-height: 100px; }
        
        .card { width: 85px; background: #1f1f1f; border-radius: 4px; overflow: hidden; border: 1px solid #333; position: relative; }
        .card img { width: 100%; height: 115px; object-fit: cover; display: block; }
        .card p { font-size: 9px; text-align: center; margin: 4px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 2px; }
        .card.missing { border-color: #ff7675; }
        .card.missing::after { content: "❌"; position: absolute; top: 2px; right: 2px; font-size: 12px; }

        .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
        button { padding: 8px 15px; border-radius: 5px; border: none; cursor: pointer; font-weight: bold; }
        .btn-load { background: var(--pastel-blue); }
        .btn-perf { background: #dfe6e9; }
        
        /* Ajuste de Performance sem travar GIF */
        body.performance-mode .card img { image-rendering: pixelated; filter: contrast(1.1); }
        
        #reserva { margin-top: 20px; border-top: 2px solid #333; padding-top: 10px; }
        .no-export { display: none !important; }
    </style>
</head>
<body>

<div class="menu">
    <textarea id="inputLista" placeholder="Nome - URL"></textarea>
    <div class="btn-row">
        <button class="btn-load" onclick="gerarCards()">📥 LOAD HAREM</button>
        <button class="btn-perf" id="perfBtn" onclick="togglePerf()">❄️ PERFORMANCE: OFF</button>
        <button style="background:#fab1a0" onclick="baixarImagem()">🖼️ SAVE PNG</button>
        <button style="background:#ff7675" onclick="resetar()">🔄 RESET</button>
    </div>
</div>

<div id="capture-area">
    <div id="lista-tiers">
        <div class="tier-row">
            <div class="tier-label" contenteditable="true">tuxn88</div>
            <div class="tier-content"></div>
        </div>
    </div>
    <div id="reserva">
        <h4 style="margin-left:10px">Storage</h4>
        <div id="reserva-content" class="tier-content"></div>
    </div>
</div>

<script>
    // Função para burlar o bloqueio de imagem do Mudae
    function fixUrl(url) {
        if (url.includes('mudae.net')) {
            return 'https://images.weserv.nl/?url=' + url.replace('https://', '');
        }
        return url;
    }

    function gerarCards() {
        const input = document.getElementById('inputLista').value;
        const linhas = input.split('\n');
        const container = document.getElementById('reserva-content');

        linhas.forEach(linha => {
            if (linha.includes(' - ')) {
                const [nome, url] = linha.split(' - ').map(s => s.trim());
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${fixUrl(url)}" loading="lazy"><p>${nome}</p>`;
                container.appendChild(card);
            }
        });
        document.getElementById('inputLista').value = '';
    }

    function togglePerf() {
        document.body.classList.toggle('performance-mode');
        const btn = document.getElementById('perfBtn');
        btn.textContent = document.body.classList.contains('performance-mode') ? '🔥 PERFORMANCE: ON' : '❄️ PERFORMANCE: OFF';
    }

    // Inicializar Arrastar e Soltar
    function initSortable(el) {
        new Sortable(el, { group: 'shared', animation: 150 });
    }

    document.querySelectorAll('.tier-content').forEach(initSortable);

    async function baixarImagem() {
        const area = document.getElementById('capture-area');
        const canvas = await html2canvas(area, { backgroundColor: '#0d0d0d', useCORS: true });
        const link = document.createElement('a');
        link.download = 'my-tier-list.png';
        link.href = canvas.toDataURL();
        link.click();
    }

    function resetar() { if(confirm("Limpar tudo?")) location.reload(); }
</script>
</body>
</html>
