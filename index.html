<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mudae Tier Maker - by Tuxn88</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --bg: #0d0d0d; --panel: #161616; --text: #f0f0f0; --accent: #2dc7b2; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .menu { background: var(--panel); padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #333; }
        textarea { width: 100%; height: 80px; background: #1f1f1f; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 10px; margin-bottom: 10px; resize: none; }
        
        .tier-row { display: flex; min-height: 120px; background: #111; border-radius: 8px; border: 1px solid #333; margin-bottom: 8px; overflow: hidden; }
        .tier-label { width: 100px; display: flex; align-items: center; justify-content: center; background: var(--accent); color: #000; font-weight: 900; text-transform: uppercase; padding: 10px; text-align: center; cursor: pointer; }
        .tier-content { flex-grow: 1; display: flex; flex-wrap: wrap; gap: 6px; padding: 10px; min-height: 100px; }
        
        .card { width: 90px; background: #1f1f1f; border-radius: 5px; border: 1px solid #333; position: relative; transition: 0.2s; }
        .card img { width: 100%; height: 125px; object-fit: cover; display: block; pointer-events: none; }
        .card p { font-size: 10px; text-align: center; margin: 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; color: #ccc; }
        
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 18px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; font-size: 11px; text-transform: uppercase; }
        #reserva { margin-top: 30px; border-top: 2px dashed #333; padding-top: 20px; }
    </style>
</head>
<body>

<div class="menu">
    <textarea id="inputLista" placeholder="Nome - URL"></textarea>
    <div class="btn-row">
        <button style="background: #74b9ff" onclick="gerarCards()">📥 Load Harem</button>
        <button style="background: #a29bfe" onclick="adicionarTier()">➕ Add Tier</button>
        <button style="background: #fab1a0" onclick="baixarImagem()">🖼️ Export PNG</button>
        <button style="background: #ff7675; margin-left: auto;" onclick="resetar()">🔄 Reset</button>
    </div>
</div>

<div id="capture-area" style="padding: 10px; background: #0d0d0d;">
    <div id="lista-tiers"></div>
    <div id="reserva">
        <h3 style="margin: 0 0 15px 10px; opacity: 0.5;">Armazenar</h3>
        <div id="reserva-content" class="tier-content"></div>
    </div>
</div>

<script>
    // Burlador de bloqueio do Mudae v2 (via Proxy Worker)
    function fixUrl(url) {
        if (url.includes('mudae.net')) {
            return 'https://images.weserv.nl/?url=' + encodeURIComponent(url.replace('https://', '')) + '&n=-1';
        }
        return url;
    }

    function gerarCards() {
        const input = document.getElementById('inputLista').value;
        const linhas = input.split('\n');
        const container = document.getElementById('reserva-content');

        linhas.forEach(linha => {
            if (linha.includes(' - ')) {
                const parts = linha.split(' - ');
                const nome = parts[0].trim();
                const url = parts[1].trim();
                
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<img src="${fixUrl(url)}" onerror="this.src='https://via.placeholder.com/90x125?text=Error'"><p>${nome}</p>`;
                container.appendChild(card);
            }
        });
        document.getElementById('inputLista').value = '';
    }

    function adicionarTier(nome = "NEW TIER") {
        const row = document.createElement('div');
        row.className = 'tier-row';
        row.innerHTML = `
            <div class="tier-label" contenteditable="true">${nome}</div>
            <div class="tier-content"></div>
        `;
        document.getElementById('lista-tiers').appendChild(row);
        new Sortable(row.querySelector('.tier-content'), { group: 'shared', animation: 150 });
    }

    // Iniciar com o tier padrão
    adicionarTier("tuxn88");
    new Sortable(document.getElementById('reserva-content'), { group: 'shared', animation: 150 });

    async function baixarImagem() {
        const area = document.getElementById('capture-area');
        const canvas = await html2canvas(area, { backgroundColor: '#0d0d0d', useCORS: true, allowTaint: false });
        const link = document.createElement('a');
        link.download = 'mudae-tier-list.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    function resetar() { if(confirm("Deseja resetar tudo?")) location.reload(); }
</script>
</body>
</html>
